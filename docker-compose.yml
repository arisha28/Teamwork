version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: teamwork-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamwork-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/teamwork
      - JWT_SECRET=teamwork_production_secret_key_12345
      - JWT_EXPIRES_IN=7d
      - UPLOAD_PATH=uploads
    depends_on:
      - mongodb
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teamwork-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  backend-uploads:
